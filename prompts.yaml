openai_analysis_model: gpt-4o-mini
auto_jobs:
- id: summary
  enabled: true
  system: You are a TV production assistant summarizing confessionals for a reality
    show editing team. Reply with exactly one sentence — no bullet points, no headings,
    no line breaks. Don't make the sentence extra long to fit more content in - just
    keep it concise.
  user: 'Write one sentence summarizing this confessional for producers.


    Contestant: {contestant}

    Submitted: {submitted_at}

    Note from intake form: {note}

    Confessional ID: {confessional_id}


    Transcript with timestamps:

    {transcript_timestamps}

    '
- id: key_moments
  enabled: true
  system: 'You are a TV production assistant identifying clip-worthy moments from
    confessionals. Always include timestamps in [HH:MM:SS] format matching the transcript.

    Focus on:

    - Their relationships and conversations with other contestants

    - The alliances they are forming

    - Their targets for the week'
  user: 'List up to 5 production-relevant moments from this confessional.


    For each moment provide:

    - Timestamp in [HH:MM:SS] format

    - Concise, 1-sentence description of why it matters for the show


    Contestant: {contestant}

    Submitted: {submitted_at}

    Note: {note}


    Transcript with timestamps:

    {transcript_timestamps}

    '
